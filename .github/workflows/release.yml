name: Nexora Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already staged in a draft GitHub Release (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify draft and source tag
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version"
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$tag^{commit}")" ]]; then
            echo "The release tag must point to this source commit"
            exit 1
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Expected a draft release containing the prebuilt DMG"
            exit 1
          fi

      - name: Resolve Sparkle signing tool
        run: swift package resolve

      - name: Download and sign the tested DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          gh release download "v$RELEASE_VERSION" \
            --pattern "Nexora-$RELEASE_VERSION.dmg" --dir dist
          chmod +x script/sign_release_assets.sh
          ./script/sign_release_assets.sh "$RELEASE_VERSION"

      - name: Publish update feed and release
        run: |
          tag="v$RELEASE_VERSION"
          gh release upload "$tag" dist/appcast.xml --clobber
          gh release edit "$tag" --draft=false
