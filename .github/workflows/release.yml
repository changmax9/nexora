name: Nexora Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve dependencies
        run: swift package resolve

      - name: Download Mihomo runtime
        run: ./script/bootstrap.sh

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" ]]; then
            echo "An Apple signing certificate is required for the TUN service. Configure APPLE_CERTIFICATE_P12_BASE64 and APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          certificate="$RUNNER_TEMP/nexora-signing.p12"
          keychain="$RUNNER_TEMP/nexora-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Build signed update assets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_CODE_SIGN_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x script/build_and_run.sh script/package_release.sh
          ./script/package_release.sh "$version"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > dist/release-notes.md <<EOF
          ## Nexora $version

          - Native macOS client powered by Mihomo
          - Signed Sparkle update feed and DMG download
          - Preferences and managed profiles remain outside the app bundle

          ### Installation

          This community build is distributed without Apple Developer ID
          notarization. If macOS blocks the first launch, Control-click the app,
          choose **Open**, and confirm. Sparkle updates are independently
          protected with an EdDSA signature.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nexora-$version.dmg" \
            "dist/appcast.xml" \
            --title "Nexora $version" \
            --notes-file "dist/release-notes.md"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nexora-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/nexora-signing.p12"
